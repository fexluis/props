<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Complemento de Excel con Office.js</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>

    <!-- === STYLES MODULE START === -->
    <style>
        :root {
            --primary-color: #0057b8;
            --secondary-color: #f5f7fa;
            --text-color: #333333;
            --success-color: #28a745;
            --error-color: #dc3545;
            --border-radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        h2 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
        }

        button:hover {
            background-color: #004494;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 16px;
            border-radius: var(--border-radius);
            background-color: #f8f9fa;
            text-align: center;
            font-size: 0.9rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            transition: opacity var(--transition);
        }

        #status[aria-busy="true"] {
            opacity: 0.8;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
                border: 4px solid var(--primary-color);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }

            h2 {
                font-size: 1.5rem;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }

        button:focus {
            outline: 3px solid var(--primary-color);
            outline-offset: 2px;
        }

        #renameResults {
            margin-top: 20px;
            padding: 16px;
            border-radius: var(--border-radius);
            background-color: #f8f9fa;
            text-align: left;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
        }

        #renameResults ul {
            list-style-type: none;
            padding: 0;
        }

        #renameResults li {
            padding: 4px 0;
        }
    </style>
    <!-- === STYLES MODULE END === -->
</head>
<body>
    <div class="container">
        <h2>Boletín de Tesorería v1.22</h2>
        <div class="button-group">
            <button id="runButton" disabled>Escribir en A1</button>
            <button id="getFolderIdButton" disabled>Listar Archivos en Excel</button>
            <button id="getCDPFolderIdButton" disabled>Indice CDP/RP</button>
            <button id="renameCDPButton" disabled>Renombrar CDP</button>
            <button id="renameRPButton" disabled>Renombrar RP</button>
        </div>
        <div id="status" aria-live="polite">Cargando Office.js...</div>
        <div id="renameResults"></div>
    </div>

    <!-- === JAVASCRIPT MODULES START === -->
    <script type="module">
        // === CONFIG MODULE ===
        const CONFIG = {
            clientId: "c1b4b92a-ddd4-471e-a375-4fbe017f1d31",
            redirectUri: "https://fexluis.github.io/onedrive-properties-addin/popup.html",
            scope: "Files.ReadWrite.All Sites.Read.All User.Read profile openid",
            excelExtensions: ['xls', 'xlsx', 'xlsm', 'xlsb'],
            recordsPerSheet: 20
        };

        // === UTILITIES MODULE ===
        function formatDate(date) {
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            return `${year}${month}${day}`;
        }

        function formatDateString(dateStr) {
            try {
                const [year, month, day] = dateStr.split('-').map(Number);
                if (!year || !month || !day) throw new Error('Invalid date components');
                const date = new Date(year, month - 1, day);
                if (isNaN(date.getTime())) throw new Error('Invalid date');
                return formatDate(date);
            } catch (error) {
                console.error(`Error formatting date string "${dateStr}":`, error.message);
                return "Error";
            }
        }

        function validateAndCorrectDate(dateStr, consecutive) {
            let correctedDate = dateStr;
            let correctedConsecutive = consecutive;
            if (dateStr.length > 8) {
                console.log(`Fecha "${dateStr}" tiene más de 8 dígitos. Tomando los primeros 8: ${dateStr.slice(0, 8)}`);
                correctedDate = dateStr.slice(0, 8);
                correctedConsecutive = dateStr.slice(8) + consecutive;
                console.log(`Consecutivo corregido: ${correctedConsecutive}`);
            }
            const year = parseInt(correctedDate.slice(0, 4));
            const month = parseInt(correctedDate.slice(4, 6)) - 1;
            const day = parseInt(correctedDate.slice(6, 8));
            const date = new Date(year, month, day);
            if (isNaN(date.getTime()) || date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) {
                console.log(`Fecha "${correctedDate}" no es válida.`);
                return { valid: false, date: correctedDate, consecutive: correctedConsecutive };
            }
            return { valid: true, date: correctedDate, consecutive: correctedConsecutive };
        }

        function updateStatus(message, isLoading = false) {
            const statusDiv = document.getElementById("status");
            statusDiv.innerHTML = '';
            statusDiv.textContent = message;
            statusDiv.setAttribute("aria-busy", isLoading);
            if (isLoading) {
                const spinner = document.createElement("div");
                spinner.className = "spinner";
                statusDiv.appendChild(spinner);
            }
        }

        function displayRenamedFiles(renamedFiles) {
            const resultsDiv = document.getElementById("renameResults");
            if (renamedFiles.length === 0) {
                resultsDiv.innerHTML = '<p>No se renombraron archivos.</p>';
                return;
            }
            const ul = document.createElement("ul");
            renamedFiles.forEach(file => {
                const li = document.createElement("li");
                li.textContent = `${file.oldName} → ${file.newName}`;
                ul.appendChild(li);
            });
            resultsDiv.innerHTML = '<p>Archivos renombrados:</p>';
            resultsDiv.appendChild(ul);
        }

        // === OFFICE MODULE ===
        const officeReady = new Promise((resolve, reject) => {
            Office.onReady(info => {
                if (info.host && info.platform) {
                    console.log(`Office.js loaded. Host: ${info.host}, Platform: ${info.platform}`);
                    updateStatus("Complemento listo.");
                    document.getElementById("runButton").disabled = false;
                    document.getElementById("getFolderIdButton").disabled = false;
                    document.getElementById("getCDPFolderIdButton").disabled = false;
                    document.getElementById("renameCDPButton").disabled = false;
                    resolve();
                } else {
                    const errorMsg = "Error: Office.js no se inicializó correctamente.";
                    console.error(errorMsg, info);
                    updateStatus(errorMsg);
                    reject(new Error(errorMsg));
                }
            }).catch(error => {
                const errorMsg = `Error al cargar Office.js: ${error.message}`;
                console.error(errorMsg, error);
                updateStatus(errorMsg);
                reject(error);
            });
        });

        async function run() {
            try {
                await officeReady;
                await Excel.run(async context => {
                    const sheet = context.workbook.worksheets.getActiveWorksheet();
                    sheet.getRange("A1").values = [["¡Hola desde Office.js!"]];
                    await context.sync();
                    updateStatus("¡Escrito en A1 con éxito!", false);
                });
            } catch (error) {
                updateStatus(`Error en run: ${error.message}`);
                console.error("Error in run:", error);
            }
        }

        async function applyFormatToRange(range) {
            range.format.borders.getItem("EdgeBottom").style = "Continuous";
            range.format.borders.getItem("EdgeLeft").style = "Continuous";
            range.format.borders.getItem("EdgeRight").style = "Continuous";
            range.format.borders.getItem("EdgeTop").style = "Continuous";
            range.format.borders.getItem("InsideHorizontal").style = "Continuous";
            range.format.borders.getItem("InsideVertical").style = "Continuous";
            range.format.horizontalAlignment = "Center";
            range.format.verticalAlignment = "Center";
            range.format.font.name = "Arial";
            range.format.font.size = 12;
            range.format.autofitColumns();
        }

        async function writeDataToSheet(context, sheet, data, startRow, files, fileStartIndex) {
            const range = sheet.getRange(`B${startRow}:K${startRow + data.length - 1}`);
            range.values = data;
            for (let i = 0; i < data.length; i++) {
                const cell = sheet.getRange(`K${startRow + i}`);
                cell.hyperlink = {
                    address: files[fileStartIndex + i].webUrl || "",
                    textToDisplay: files[fileStartIndex + i].name || "Sin nombre"
                };
            }
            const columnB = sheet.getRange(`B${startRow}:B${startRow + data.length - 1}`);
            const columnD = sheet.getRange(`D${startRow}:D${startRow + data.length - 1}`);
            columnB.format.wrapText = true;
            columnD.format.wrapText = true;
            columnB.format.autofitColumns();
            columnD.format.autofitColumns();
        }

        // === PDF PROCESSING MODULE ===
        async function getPDFPageCount(url, accessToken) {
            console.log(`Getting page count for ${url}`);
            try {
                const response = await fetch(url, { headers: { "Authorization": `Bearer ${accessToken}` } });
                if (!response.ok) throw new Error(`Error downloading PDF: ${response.statusText}`);
                const arrayBuffer = await response.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                return pdf.numPages;
            } catch (error) {
                console.error("Error counting pages:", error);
                return "Error";
            }
        }

        async function getPDFText(url, accessToken) {
            console.log(`Searching text in ${url} (page 1 only)`);
            try {
                const response = await fetch(url, { headers: { "Authorization": `Bearer ${accessToken}` } });
                if (!response.ok) throw new Error(`Error downloading PDF: ${response.statusText}`);
                const arrayBuffer = await response.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        
                const result = {
                    numero: "Error",
                    numeroRP: "Error",
                    fechaRegistro: "Error",
                    razonSocial: "Error"
                };
        
                const page = await pdf.getPage(1);
                const textContent = await page.getTextContent();
                const textItems = textContent.items.map(item => item.str);
        
                console.log(`Extracted text from page 1 of ${url}:`, textItems);
        
                // Find index of "Unidad / Subunidad Ejecutora:" or "Unidad / Subunidad"
                let unidadIndex = textItems.findIndex(item => 
                    item.trim() === "Unidad / Subunidad Ejecutora:" || 
                    item.trim() === "Unidad / Subunidad" ||
                    item.trim() === "Unidad / Subunidad ejecutora:"
                );
                if (unidadIndex === -1) {
                    // Fallback: search entire array if not found
                    unidadIndex = textItems.length;
                }
        
                // Search for "Número:" and "Fecha Registro:" before unidadIndex
                for (let i = 0; i < unidadIndex; i++) {
                    const currentItem = textItems[i].trim();
                    if (currentItem === "ORDEN DE PAGO PRESUPUESTAL" && i + 2 < textItems.length) {
                        const value = textItems[i + 2].trim();
                        if (value) result.numero = value.toUpperCase();
                    }
                    if (currentItem === "Número:" && i + 2 < textItems.length) {
                        const value = textItems[i + 2].trim();
                        if (value) result.numeroRP = value;
                    }
                    if (currentItem === "Fecha Registro:" && i + 2 < textItems.length) {
                        const value = textItems[i + 2].trim();
                        if (value) result.fechaRegistro = value;
                    }
                }
        
                // Search for "Razón Social:" in the entire array
                for (let i = 0; i < textItems.length - 2; i++) {
                    const currentItem = textItems[i].trim();
                    if (currentItem === "Razón Social:" && i + 2 < textItems.length) {
                        const value = textItems[i + 2].trim();
                        if (value) result.razonSocial = value.toUpperCase();
                    }
                }
        
                console.log(`Extracted values from page 1 of ${url}:`, {
                    "ORDEN DE PAGO PRESUPUESTAL": result.numero,
                    "numeroRP": result.numeroRP,
                    "Fecha Registro": result.fechaRegistro,
                    "Razón Social": result.razonSocial
                });
        
                return result;
            } catch (error) {
                console.error(`Error processing PDF ${url}:`, error);
                return { numero: "Error", numeroRP: "Error", fechaRegistro: "Error", razonSocial: "Error" };
            }
        }

        // === AUTHENTICATION MODULE ===
        async function fetchWithAuth(url, accessToken, errorMessage) {
            console.log(`Fetching ${url}`);
            try {
                const response = await fetch(url, { headers: { "Authorization": `Bearer ${accessToken}` } });
                if (!response.ok) {
                    if (response.status === 401) {
                        console.log("Invalid token. Requesting new token...");
                        localStorage.removeItem("accessToken");
                        await initiateOAuthFlow();
                        throw new Error("Reauthentication required");
                    }
                    const errorText = await response.text();
                    throw new Error(`${errorMessage}: ${response.statusText} - ${errorText}`);
                }
                return response.json();
            } catch (error) {
                console.error(`Error in fetchWithAuth for ${url}:`, error);
                throw error;
            }
        }

        async function initiateOAuthFlow() {
            return new Promise((resolve, reject) => {
                const authUrl = `https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=${encodeURIComponent(CONFIG.clientId)}&response_type=token&redirect_uri=${encodeURIComponent(CONFIG.redirectUri)}&scope=${encodeURIComponent(CONFIG.scope)}&response_mode=fragment&prompt=consent`;
                const authWindow = window.open(authUrl, "authWindow", "width=500,height=600");
                if (!authWindow) {
                    updateStatus("Error: Permite ventanas emergentes.");
                    reject(new Error("Popup blocked"));
                    return;
                }

                updateStatus("Esperando autenticación...", true);
                window.addEventListener("message", function handler(event) {
                    if (event.origin !== "https://fexluis.github.io") return;
                    if (event.data.accessToken) {
                        localStorage.setItem("accessToken", event.data.accessToken);
                        updateStatus("Token obtenido. Haz clic nuevamente en el botón.");
                        authWindow.close();
                        window.removeEventListener("message", handler);
                        resolve();
                    } else if (event.data.error) {
                        updateStatus(`Error de autenticación: ${event.data.error}`);
                        authWindow.close();
                        window.removeEventListener("message", handler);
                        reject(new Error(event.data.error));
                    }
                });
            });
        }

        // === MAIN LOGIC MODULE ===
        async function listFilesInParentFolder(xDoc) {
            try {
                await officeReady;
                let accessToken = localStorage.getItem("accessToken");
                if (!accessToken) {
                    await initiateOAuthFlow();
                    return;
                }
        
                updateStatus("Obteniendo nombre del archivo...", true);
                let fileName;
                await Excel.run(async context => {
                    const workbook = context.workbook;
                    workbook.load("name");
                    await context.sync();
                    fileName = workbook.name;
                    updateStatus(`Nombre del archivo: ${fileName}`);
                });
        
                updateStatus("Obteniendo drive raíz...", true);
                const rootData = await fetchWithAuth("https://graph.microsoft.com/v1.0/me/drive/root", accessToken, "Error al obtener la raíz");
                const driveId = rootData.parentReference.driveId;
                updateStatus(`Drive ID de la raíz: ${driveId}`);
        
                updateStatus("Buscando archivo reciente...", true);
                const recentData = await fetchWithAuth("https://graph.microsoft.com/v1.0/me/drive/recent", accessToken, "Error al obtener archivos recientes");
                const file = recentData.value.find(item => item.name === fileName && item.file);
                if (!file) {
                    updateStatus("Archivo no encontrado en recientes.");
                    console.error("No file found in recent files matching:", fileName);
                    return;
                }
        
                const parentFolderId = file.parentReference.id;
                const fileDriveId = file.parentReference.driveId;
                updateStatus(`ID de la carpeta padre: ${parentFolderId}`);
        
                updateStatus("Listando archivos en la carpeta padre...", true);
                const childrenData = await fetchWithAuth(`https://graph.microsoft.com/v1.0/drives/${fileDriveId}/items/${parentFolderId}/children`, accessToken, "Error al listar archivos");
        
                console.log("Archivos encontrados en la carpeta padre:", childrenData.value.map(item => item.name));
        
                const files = childrenData.value.filter(item => {
                    const ext = item.name.includes('.') && !item.folder ? item.name.split('.').pop().toLowerCase() : "";
                    return !CONFIG.excelExtensions.includes(ext);
                });
        
                console.log("Archivos filtrados (no carpetas):", files.map(item => item.name));
        
                updateStatus(`Procesando ${files.length} archivos...`, true);
                const tableData = await Promise.all(files.map(async (item, index) => {
                    const createDate = new Date(item.createdDateTime || new Date());
                    const modifiedDate = new Date(item.lastModifiedDateTime || item.createdDateTime || new Date());
                    let formattedCreateDate = formatDate(createDate);
                    const formattedModifiedDate = formatDate(modifiedDate);
                    const sizeInKB = (item.size || 0) / 1024;
                    const extension = item.name.includes('.') && !item.folder ? item.name.split('.').pop().toUpperCase() : "";
                    const nameWithoutExtension = item.name.includes('.') ? item.name.substring(0, item.name.lastIndexOf('.')) : item.name;
        
                    let fileCreateDate, obligacion, categoria, documentos, newFileName;
                    let numOP = "00000";
                    let beneficiario = "BENEFICIARIO";
                    let letras = ""; 
                    let consecutivo = "";
                    let numeroRP = "";                    

                    let pageCount = 1;
                    if (extension === "PDF" && !item.folder) {
                        const contentUrl = `https://graph.microsoft.com/v1.0/drives/${fileDriveId}/items/${item.id}/content`;
                        pageCount = await getPDFPageCount(contentUrl, accessToken);
                        const pdfText = await getPDFText(contentUrl, accessToken);
                        if (pdfText.numero !== "Error") {
                            numOP = pdfText.numero;
                        }
                        if (pdfText.numeroRP !== "Error") {
                            numeroRP = pdfText.numeroRP;
                        }
                        if (pdfText.razonSocial !== "Error") {
                            beneficiario = pdfText.razonSocial;
                        }
                        if (pdfText.fechaRegistro !== "Error") {
                            const formattedDate = formatDateString(pdfText.fechaRegistro);
                            if (formattedDate !== "Error") {
                                formattedCreateDate = formattedDate;
                            }
                        }
        
                    if (xDoc === "boletines") {
                        const fileNameParts = nameWithoutExtension.split("_");
                        fileCreateDate = fileNameParts[0] || "";
                        obligacion = fileNameParts[1] || "";
                        categoria = fileNameParts[2] || "";
                        documentos = "";
        
                        if (categoria === "Via") {
                            categoria = "VIATICO";
                            documentos = "ORDEN DE PAGO, OBLIGACION, SOLICITUD, AUTORIZACIÓN, REGISTRO PRESUPUESTAL, INFORME, CERTIFICADO CUMPLIMIENTO";
                        } else if (categoria === "Vian" || categoria === "ViaAnt") {
                            categoria = "ANTICIPO VIATICO";
                            documentos = "ORDEN DE PAGO, OBLIGACION, SOLICITUD, AUTORIZACIÓN, REGISTRO PRESUPUESTAL";
                        } else if (categoria === "Hon") {
                            categoria = "HONORARIO";
                            documentos = "ORDEN DE PAGO, OBLIGACION, SEGURIDAD SOCIAL PLANILLA PAGADA, INFORME";
                        } else if (categoria === "Sso") {
                            categoria = "SEGURIDAD SOCIAL";
                            documentos = "ORDEN DE PAGO, OBLIGACION, DOCUMENTOS CONTABLES, PLANILLA SEGURIDAD SOCIAL PAGADA, PAGO";
                        } else if (categoria === "Nom") {
                            categoria = "NOMINA";
                            documentos = "ORDEN DE PAGO, OBLIGACION, LIQUIDACION - NOMINA, ASIENTO CONTABLE, PRESUPUESTO, PLANILLA SEGURIDAD SOCIAL PAGADA, PAGO";
                        } else if (categoria === "Fna") {
                            categoria = "CESANTIA";
                            documentos = "ORDEN DE PAGO, OBLIGACION, LIQUIDACION CESANTIAS, PAGO BANCARIO";
                        } else if (categoria === "Arr") {
                            categoria = "ARRIENDO";
                            documentos = "ORDEN DE PAGO, OBLIGACION, FACTURA, SEGURIDAD SOCIAL, REGISTRO PRESUPUESTAL, INFORME SUPERVISIÓN";
                        } else if (categoria === "Tra") {
                            categoria = "TRANSPORTE";
                            documentos = "ORDEN DE PAGO, OBLIGACION, FACTURA, DOCUMENTOS";
                        } else if (categoria === "Arl") {
                            categoria = "RIESGOS LABORALES";
                            documentos = "ORDEN DE PAGO, OBLIGACION, COMPROBANTE, PAGO BANCARIO";
                        } else if (categoria === "Apr") {
                            categoria = "AREA PROTEGIDA";
                            documentos = "ORDEN DE PAGO, OBLIGACION, FACTURA, DOCUMENTOS";
                        } else if (categoria === "4pm") {
                            categoria = "GMF 4x1000";
                            documentos = "ORDEN DE PAGO, OBLIGACION";
                        } else if (categoria === "Pre") {
                            categoria = "IMPUESTO PREDIAL";
                            documentos = "ORDEN DE PAGO, OBLIGACION, FACTURA, PAGO BANCARIO";
                        } else if (categoria === "Pro") {
                            categoria = "PROVEEDOR";
                            documentos = "ORDEN DE PAGO, OBLIGACION, FACTURA, DOCUMENTOS";
                        } else if (categoria === "Spu") {
                            categoria = "SERVICIOS PUBLICOS";
                            documentos = "ORDEN DE PAGO, OBLIGACION, FACTURA, PAGO BANCARIO";
                        } else if (categoria === "Est") {
                            categoria = "ESTIMULO ACADEMICO";
                            documentos = "ORDEN DE PAGO, OBLIGACION, RESOLUCION, REF. BANCARIA, CEDULA, REGISTRO PRESUPUESTAL, INFORMES, CERTIFICADO CUMPLIMIENTO";
                        } else {
                            categoria = "PROVEEDOR";
                            documentos = "ORDEN DE PAGO, OBLIGACION, FACTURA, DOCUMENTOS";
                        }
        
                        newFileName = `OP-${numOP}-OB-${obligacion} - ${beneficiario}`;
                        
                    } else if (xDoc === "CDP") {
                        const fileNameParts = nameWithoutExtension.split("_");
                        fileCreateDate = fileNameParts[0] || "";
                        obligacion = fileNameParts[1] || "";
                        categoria = fileNameParts[2] || "";
                        documentos = "";
        
                        // Extract letras and consecutivo from obligacion
                        const pattern = /^(CDP|RP)(\d{3,6})$/i;
                        const match = obligacion.match(pattern);
        
                        if (match) {
                            letras = match[1].toUpperCase();
                            consecutivo = match[2];
                        }
        
                        if (letras === "CDP") {
                            documentos = "N/A";
                            categoria = "CDP";
                            newFileName = `CERTIFICADO DE DISPONIBILIDAD PRESUPUESTAL ${consecutivo}`;
                        } else if (letras === "RP") {
                            documentos = "N/A";
                            categoria = "RP";
                            newFileName = `RP ${numeroRP} - ${beneficiario}`;
                        } else {
                            // Fallback if letras not found
                            categoria = "RP";
                            documentos = "N/A";
                            newFileName = `RP ${numeroRP} - ${beneficiario}`;
                        }
                    }                      
                     
                        updateStatus(`Procesando archivo ${index + 1}/${files.length}`, true);
                    }
        
                    const columnCValue = categoria;
        
                    return [
                        newFileName,
                        columnCValue,
                        documentos,
                        formattedCreateDate,
                        formattedModifiedDate,
                        1,
                        pageCount,
                        extension,
                        `${sizeInKB.toFixed(2)} KB`,
                        item.name || "Sin nombre"
                    ];
                }));
        
                updateStatus("Escribiendo datos en Excel...", true);
                await Excel.run(async context => {
                    let sheet = context.workbook.worksheets.getActiveWorksheet();
                    sheet.load("name");
                    await context.sync();
                    const baseSheetName = sheet.name.split(" ")[0] || "Sheet";
        
                    const initialRange = sheet.getRange("B10:K29");
                    initialRange.clear("All");
        
                    for (let i = 0; i < tableData.length; i += CONFIG.recordsPerSheet) {
                        const chunk = tableData.slice(i, i + CONFIG.recordsPerSheet);
                        const fileChunk = files.slice(i, i + CONFIG.recordsPerSheet);
                        const sheetIndex = Math.floor(i / CONFIG.recordsPerSheet);
        
                        if (i > 0) {
                            const newSheet = sheet.copy("After", sheet);
                            sheet = newSheet;
                            sheet.name = `${baseSheetName} ${sheetIndex + 1}`;
                            const clearRange = sheet.getRange("B10:K29");
                            clearRange.clear("All");
                        }
        
                        const formatRange = sheet.getRange("B10:K29");
                        await applyFormatToRange(formatRange);
                        await writeDataToSheet(context, sheet, chunk, 10, files, i);
                        updateStatus(`Escribiendo en ${sheet.name}...`);
                    }
        
                    await context.sync();
                    updateStatus(`Datos escritos en ${Math.ceil(tableData.length / CONFIG.recordsPerSheet)} hoja(s).`);
                });
            } catch (error) {
                updateStatus(`Error: ${error.message}`);
                console.error("Error in listFilesInParentFolder:", error);
            }
        }

        async function renameCDPFiles() {
            try {
                await officeReady;
                let accessToken = localStorage.getItem("accessToken");
                if (!accessToken) {
                    await initiateOAuthFlow();
                    return;
                }

                updateStatus("Obteniendo nombre del archivo...", true);
                let fileName;
                await Excel.run(async context => {
                    const workbook = context.workbook;
                    workbook.load("name");
                    await context.sync();
                    fileName = workbook.name;
                    updateStatus(`Nombre del archivo: ${fileName}`);
                });

                updateStatus("Obteniendo drive raíz...", true);
                const rootData = await fetchWithAuth("https://graph.microsoft.com/v1.0/me/drive/root", accessToken, "Error al obtener la raíz");
                const driveId = rootData.parentReference.driveId;
                updateStatus(`Drive ID de la raíz: ${driveId}`);

                updateStatus("Buscando archivo reciente...", true);
                const recentData = await fetchWithAuth("https://graph.microsoft.com/v1.0/me/drive/recent", accessToken, "Error al obtener archivos recientes");
                const file = recentData.value.find(item => item.name === fileName && item.file);
                if (!file) {
                    updateStatus("Archivo no encontrado en recientes.");
                    console.error("No file found in recent files matching:", fileName);
                    return;
                }

                const parentFolderId = file.parentReference.id;
                const fileDriveId = file.parentReference.driveId;
                updateStatus(`ID de la carpeta padre: ${parentFolderId}`);

                updateStatus("Listando archivos en la carpeta padre...", true);
                const childrenData = await fetchWithAuth(`https://graph.microsoft.com/v1.0/drives/${fileDriveId}/items/${parentFolderId}/children`, accessToken, "Error al listar archivos");

                console.log("Archivos encontrados en la carpeta padre:", childrenData.value.map(item => item.name));

                const files = childrenData.value.filter(item => !item.folder);
                console.log("Archivos filtrados (no carpetas):", files.map(item => item.name));

                const renamedFiles = [];
                let xLetras = null; // Initialize xLetras

                updateStatus(`Procesando ${files.length} archivos para renombrar...`, true);

                // Updated regex to match YYYYMMDD[separators][CDP|RP or missing]Consecutive[separators]Description
                const cdpPattern = /^(\d{8,9})(\s*_?\s*(?:CDP|RP)?\s*_?\s*)(\d{3,6})\s*_?\s*(.+)$/i;

                for (let i = 0; i < files.length; i++) {
                    const item = files[i];
                    const ext = item.name.includes('.') ? `.${item.name.split('.').pop()}` : '';
                    const nameWithoutExtension = item.name.replace(ext, '');
                    console.log(`Procesando archivo ${i + 1}/${files.length}: ${item.name}`);
                    console.log(`Nombre sin extensión: ${nameWithoutExtension}`);

                    const match = nameWithoutExtension.match(cdpPattern);
                    console.log(`Resultado de cdpPattern en "${nameWithoutExtension}":`, match);

                    if (match) {
                        let [, dateStr, letrasMatch, consecutive, descripcion] = match;
                        console.log(`Coincidencia encontrada: fecha=${dateStr}, letras=${letrasMatch.trim() || '""'}, consecutivo=${consecutive}, descripcion=${descripcion}`);

                        // Extract letras (CDP or RP) or set to empty
                        let letras = letrasMatch.match(/CDP|RP/i) ? letrasMatch.match(/CDP|RP/i)[0] : '';
                        console.log(`Letras extraídas: ${letras || '""'}`);

                        // Set xLetras from the first matched file
                        if (xLetras === null && letras) {
                            xLetras = letras.toUpperCase();
                            console.log(`Asignar variable: xLetras = "${xLetras}"`);
                        }

                        // If letras is empty, use xLetras
                        if (!letras && xLetras) {
                            letras = xLetras;
                            console.log(`Letras vacías, usando xLetras: ${letras}`);
                        } else if (!letras) {
                            console.log(`No se encontraron letras y xLetras no está definido. Se omite: ${item.name}`);
                            continue;
                        }

                        // Validate and correct date
                        const { valid, date, consecutive: correctedConsecutive } = validateAndCorrectDate(dateStr, consecutive);
                        if (!valid) {
                            console.log(`Archivo "${item.name}" tiene una fecha inválida: ${date}. Se omite.`);
                            continue;
                        }

                        // Transform description
                        let transformedDesc = descripcion
                            .normalize('NFD')
                            .replace(/[\u0300-\u036f]/g, '')
                            .replace(/[^a-zA-Z0-9]/g, '')
                            .replace(/\s/g, '');
                        transformedDesc = transformedDesc.charAt(0).toUpperCase() + (transformedDesc.length > 1 ? transformedDesc.slice(1).toLowerCase() : '');
                        console.log(`Descripción transformada: ${transformedDesc}`);

                        // Construct new filename
                        let newFileName = `${date}_${letras}${correctedConsecutive}_${transformedDesc}${ext}`;
                        console.log(`Nombre de archivo propuesto: ${newFileName} (${newFileName.length} caracteres)`);

                        // Truncate to 30 characters if necessary
                        if (newFileName.length > 30) {
                            const maxDescLength = 30 - (date.length + `_${letras}${correctedConsecutive}_`.length + ext.length);
                            if (maxDescLength > 0) {
                                transformedDesc = transformedDesc.substring(0, maxDescLength);
                                newFileName = `${date}_${letras}${correctedConsecutive}_${transformedDesc}${ext}`;
                                console.log(`Nombre truncado a 30 caracteres: ${newFileName} (${newFileName.length} caracteres)`);
                            } else {
                                console.log(`Descripción demasiado larga incluso tras truncar. Se omite: ${item.name}`);
                                continue;
                            }
                        }

                        // Skip renaming if the filename is already correct
                        if (item.name === newFileName) {
                            console.log(`Archivo "${item.name}" ya tiene el nombre correcto. Se omite.`);
                            continue;
                        }

                        // Rename the file using Microsoft Graph API
                        const renameUrl = `https://graph.microsoft.com/v1.0/drives/${fileDriveId}/items/${item.id}`;
                        console.log(`Renombrando archivo mediante API: ${renameUrl}`);
                        const renameResponse = await fetch(renameUrl, {
                            method: 'PATCH',
                            headers: {
                                "Authorization": `Bearer ${accessToken}`,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                name: newFileName
                            })
                        });

                        if (!renameResponse.ok) {
                            const errorText = await renameResponse.text();
                            console.error(`Error al renombrar ${item.name}: ${renameResponse.statusText}`, errorText);
                            throw new Error(`Error al renombrar ${item.name}: ${renameResponse.statusText}`);
                        }

                        renamedFiles.push({ oldName: item.name, newName: newFileName });
                        updateStatus(`Renombrado ${item.name} a ${newFileName}`, true);
                        console.log(`Archivo renombrado exitosamente: ${item.name} → ${newFileName}`);
                    } else {
                        console.log(`Archivo "${item.name}" no coincide con el patrón CDP/RP. Se omite.`);
                    }
                }

                updateStatus(`Renombramiento completado. Procesados ${files.length} archivos, renombrados ${renamedFiles.length}.`, false);
                displayRenamedFiles(renamedFiles);
            } catch (error) {
                updateStatus(`Error: ${error.message}`);
                console.error("Error in renameCDPFiles:", error);
            }
        }

        async function renameRPFiles() {

                let accessToken = localStorage.getItem("accessToken");

                    await initiateOAuthFlow();

                const driveId = rootData.parentReference.driveId;

                const file = recentData.value.find(item => item.name === fileName && item.file);
                if (!file) {

                }
        
                const parentFolderId = file.parentReference.id;
                const fileDriveId = file.parentReference.driveId;

                updateStatus("Listando archivos en la carpeta padre...", true);
                const childrenData = await fetchWithAuth(`https://graph.microsoft.com/v1.0/drives/${fileDriveId}/items/${parentFolderId}/children`, accessToken, "Error al listar archivos");
        
                console.log("Archivos encontrados en la carpeta padre:", childrenData.value.map(item => item.name));
        
                const files = childrenData.value.filter(item => !item.folder && item.name.toLowerCase().endsWith('.pdf'));
                console.log("Archivos filtrados (PDFs):", files.map(item => item.name));
        
                const renamedFiles = [];
        
                updateStatus(`Procesando ${files.length} archivos PDF para renombrar...`, true);
        
                for (let i = 0; i < files.length; i++) {
                    const item = files[i];
                    const ext = item.name.includes('.') ? `.${item.name.split('.').pop()}` : '';
                    console.log(`Procesando archivo ${i + 1}/${files.length}: ${item.name}`);
        
                    // Obtener texto del PDF
                    const contentUrl = `https://graph.microsoft.com/v1.0/drives/${fileDriveId}/items/${item.id}/content`;
                    const pdfText = await getPDFText(contentUrl, accessToken);
        
                    let numeroRP = pdfText.numeroRP !== "Error" ? pdfText.numeroRP : "";
                    let beneficiario = pdfText.razonSocial !== "Error" ? pdfText.razonSocial : "SinBeneficiario";
                    let formattedDate = pdfText.fechaRegistro !== "Error" ? formatDateString(pdfText.fechaRegistro) : formatDate(new Date());
        
                    if (formattedDate === "Error") {
                        console.log(`Fecha inválida en ${item.name}. Usando fecha actual.`);
                        formattedDate = formatDate(new Date());
                    }
        
                    // Transform beneficiario
                    let transformedBeneficiario = beneficiario
                        .normalize('NFD')
                        .replace(/[\u0300-\u036f]/g, '')
                        .replace(/[^a-zA-Z0-9]/g, '')
                        .replace(/\s/g, '');
                    transformedBeneficiario = transformedBeneficiario.charAt(0).toUpperCase() + (transformedBeneficiario.length > 1 ? transformedBeneficiario.slice(1).toLowerCase() : '');
                    console.log(`Beneficiario transformado: ${transformedBeneficiario}`);
        
                    // Construct new filename base
                    let baseFileName = `${formattedDate}_RP_${numeroRP}_${transformedBeneficiario}`;
                    console.log(`Nombre base propuesto: ${baseFileName} (${baseFileName.length} caracteres)`);
        
                    // Truncate to 30 characters if necessary (excluding extension)
                    if (baseFileName.length > 30) {
                        const maxBenefLength = 30 - (formattedDate.length + `_RP_${numeroRP}_`.length);
                        if (maxBenefLength > 0) {
                            transformedBeneficiario = transformedBeneficiario.substring(0, maxBenefLength);
                            baseFileName = `${formattedDate}_RP_${numeroRP}_${transformedBeneficiario}`;
                            console.log(`Nombre base truncado a 30 caracteres: ${baseFileName} (${baseFileName.length} caracteres)`);
                        } else {
                            console.log(`Beneficiario demasiado largo incluso tras truncar. Se omite: ${item.name}`);
                            continue;
                        }
                    }
        
                    const newFileName = `${baseFileName}${ext}`;
                    console.log(`Nombre de archivo propuesto: ${newFileName} (${newFileName.length} caracteres)`);
        
                    // Skip renaming if the filename is already correct
                    if (item.name === newFileName) {
                        console.log(`Archivo "${item.name}" ya tiene el nombre correcto. Se omite.`);
                        continue;
                    }
        
                    // Rename the file using Microsoft Graph API
                    const renameUrl = `https://graph.microsoft.com/v1.0/drives/${fileDriveId}/items/${item.id}`;
                    console.log(`Renombrando archivo mediante API: ${renameUrl}`);
                    const renameResponse = await fetch(renameUrl, {
                        method: 'PATCH',
                        headers: {
                            "Authorization": `Bearer ${accessToken}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name: newFileName
                        })
                    });
        
                    if (!renameResponse.ok) {
                        const errorText = await renameResponse.text();
                        console.error(`Error al renombrar ${item.name}: ${renameResponse.statusText}`, errorText);
                        throw new Error(`Error al renombrar ${item.name}: ${renameResponse.statusText}`);
                    }
        
                    renamedFiles.push({ oldName: item.name, newName: newFileName });
                    updateStatus(`Renombrado ${item.name} a ${newFileName}`, true);
                    console.log(`Archivo renombrado exitosamente: ${item.name} → ${newFileName}`);
                }
        
                updateStatus(`Renombramiento completado. Procesados ${files.length} archivos, renombrados ${renamedFiles.length}.`, false);
                displayRenamedFiles(renamedFiles);
            } catch (error) {
                updateStatus(`Error: ${error.message}`);
                console.error("Error in renameRPFiles:", error);
            }
        }

        // === EVENT LISTENERS ===
        officeReady.then(() => {
            document.getElementById("runButton").disabled = false;
            document.getElementById("getFolderIdButton").disabled = false;
            document.getElementById("getCDPFolderIdButton").disabled = false;
            document.getElementById("renameCDPButton").disabled = false;
            document.getElementById("renameRPButton").disabled = false; // Habilitar el nuevo botón
            document.getElementById("runButton").onclick = run;
            document.getElementById("getFolderIdButton").onclick = () => listFilesInParentFolder('boletines');
            document.getElementById("getCDPFolderIdButton").onclick = () => listFilesInParentFolder('CDP');
            document.getElementById("renameCDPButton").onclick = renameCDPFiles;
            document.getElementById("renameRPButton").onclick = renameRPFiles;
        });
    </script>
